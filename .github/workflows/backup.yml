name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: read
concurrency:
  group: wasla-production-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-backup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify required settings without revealing them
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: |
          python - <<'PY'
          import os
          required = ['BACKUP_DATABASE_URL','BACKUP_AGE_RECIPIENT','BACKUP_S3_PREFIX','AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_DEFAULT_REGION']
          missing = [key for key in required if not os.environ.get(key)]
          if missing: raise SystemExit('Backup not configured: ' + ', '.join(missing))
          PY
      - name: Install encryption and matching database client
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client-17
          pg_dump --version
      - name: Encrypt and upload
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: python scripts/backup_postgres.py

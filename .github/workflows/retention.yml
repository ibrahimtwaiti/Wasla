name: Production data retention
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/retention.yml
      - scripts/retention_cleanup.py
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
concurrency:
  group: wasla-production-retention
  cancel-in-progress: false
jobs:
  retention:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production-backup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install database driver
        run: pip install -r requirements.txt
      - name: Report due deletions without exposing customer data
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          WASLA_ENV: production
        run: python -m scripts.retention_cleanup
      - name: Enforce approved bounded retention rules
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          WASLA_ENV: production
          WASLA_RETENTION_APPLY: 'YES'
        run: python -m scripts.retention_cleanup --apply

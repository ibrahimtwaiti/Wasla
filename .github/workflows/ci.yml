name: V1 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q wasla scripts
      - run: node --check wasla/static/app.js
      - run: python -m unittest discover -s tests -v

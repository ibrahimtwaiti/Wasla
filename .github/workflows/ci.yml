name: V1 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q wasla scripts
      - run: node --check wasla/static/app.js
      - run: python -m unittest discover -s tests -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wasla_test
          POSTGRES_USER: wasla_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wasla_test -d wasla_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations, PostgreSQL acceptance, isolation and concurrent worker
        env:
          DATABASE_URL: postgresql://wasla_test:ci-disposable-only@localhost:5432/wasla_test
          DATABASE_URL_UNPOOLED: postgresql://wasla_test:ci-disposable-only@localhost:5432/wasla_test
          WASLA_TEST_DATABASE_URL: postgresql://wasla_test:ci-disposable-only@localhost:5432/wasla_test
        run: |
          python -m wasla.cli init
          python -m unittest discover -s tests -p 'test_postgres.py' -v

name: Production queue health
on:
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: read
concurrency:
  group: wasla-queue-monitor
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-backup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]>=3.2.10,<4'
      - name: Check pending age and dead events
        env:
          MONITOR_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          QUEUE_MAX_AGE_SECONDS: '300'
        run: python -m scripts.check_queue

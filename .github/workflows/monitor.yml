name: Production health
on:
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: read
concurrency:
  group: wasla-health
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: python -m scripts.smoke_production https://wasla-olive.vercel.app
